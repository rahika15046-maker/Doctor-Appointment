services:
  # ── Backend API — Node.js / Express ──────────────────────────────────────────
  - type: web
    name: medora-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # Set in Render dashboard → Environment
      - key: JWT_SECRET
        sync: false          # Set in Render dashboard → Environment
      - key: COOKIE_DOMAIN
        sync: false          # e.g. medora-api.onrender.com
    healthCheckPath: /api/health

  # ── Frontend — React / Vite Static Site ─────────────────────────────────────
  - type: web
    name: medora-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
